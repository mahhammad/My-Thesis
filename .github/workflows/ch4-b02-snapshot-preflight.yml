name: CH4 B02 canonical Train and target preflight — NO SOLVERS
on:
  push:
    branches: [experiment/ch4-inv01-b02-preflight]
    paths:
      - 'code/experiments/inverse_attainable_standard/b02_preflight/**'
      - '.github/workflows/ch4-b02-snapshot-preflight.yml'
permissions:
  contents: write
jobs:
  snapshot-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated branch at submitted commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU libraries - outside numerical timer
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Generate canonical Train and three forward-only targets - hard 120 second timeout
        run: |
          set -euo pipefail
          test ! -e code/experiments/inverse_attainable_standard/b02_preflight/manifest.json || {
            echo "Immutable snapshot exists: refusing to overwrite"
            exit 1
          }
          timeout --signal=TERM --kill-after=5s 120s python code/experiments/inverse_attainable_standard/b02_preflight/build_snapshot.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("code/experiments/inverse_attainable_standard/b02_preflight")
          v=json.loads((p/"verification.json").read_text())
          assert v["status"]=="PASS" and v["solvers_executed"]==0
          assert v["forwards"]==3 and v["gradients"]==0 and v["jacobians"]==0
          assert v["wall_numerical_seconds"]<120 and v["peak_rss_mib"]<1024
          assert all(t["detected"] for t in v["tamper"].values())
          print("RESEARCHER04_B02_SNAPSHOT_PREFLIGHT_PASS",v)
          PY
      - name: Preserve only new B02 snapshot and verification evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/inverse_attainable_standard/b02_preflight/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ch4): archive B02 preflight Train snapshot and fail-closed evidence'
            git push origin HEAD:experiment/ch4-inv01-b02-preflight
          fi
