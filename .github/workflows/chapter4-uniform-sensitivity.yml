name: Chapter 4 Uniform policy sensitivity report

on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/uniform_policy_hyperparameter_sensitivity/**'
      - 'tex/chapter4.tex'
      - 'code/experiments/benchmark_v1/test_chapter4_latex_syntax.py'
      - '.github/workflows/chapter4-uniform-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-existing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate nine stored runs, geometric coefficients, tables and TikZ/SVG sources
        run: |
          python -m unittest discover -v \
            -s code/experiments/uniform_policy_hyperparameter_sensitivity -p 'test_*.py'
      - name: Guard Chapter 4 equation labels and escaped file names
        run: |
          python -m unittest discover -v \
            -s code/experiments/benchmark_v1 -p 'test_chapter4_latex_syntax.py'
      - name: Check strict Test holdout in report setup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("code/experiments/benchmark_v1/experiment_fixed_baselines.py").read_text()
          assert "dataset_train_val" in s
          assert "dataset_train_val(spec)" in s
          assert "children[2]" not in s
          assert "training_steps\": 0" in s
          print("Registered exact baseline runner only uses Train and Validation and zero training steps.")
          PY
