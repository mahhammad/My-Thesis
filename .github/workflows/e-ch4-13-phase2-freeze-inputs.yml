name: E-CH4-13 phase2 freeze 3 Train and Validation seeds (NO TRAINING)
on:
  push:
    branches:
      - experiment/ch4-loss-controlled-comparison-01
    paths:
      - 'code/experiments/ch4_loss_controlled_comparison/**'
      - '.github/workflows/e-ch4-13-phase2-freeze-inputs.yml'
permissions:
  contents: write
jobs:
  freeze-inputs-only:
    if: contains(github.event.head_commit.message, '[FREEZE_PHASE2_INPUTS]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_CORETYPE: generic
      OPENBLAS_NUM_THREADS: '1'
      E_CH4_13_FREEZE_INPUTS_ONCE: 'true'
      E_CH4_13_PHASE2_OPT_IN: 'NOT_AUTHORIZED'
      E_CH4_13_PHASE2_EXTERNAL_GATE_VERIFIED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy only (no optimizer or Test execution)
        run: python -m pip install numpy==2.4.6
      - name: Freeze Train and Validation only, all three seeds, once
        run: |
          test ! -e code/experiments/ch4_loss_controlled_comparison/inputs/phase2_train_validation
          python code/experiments/ch4_loss_controlled_comparison/phase2_frozen_data.py \
            --freeze --source-sha "${{ github.sha }}"
      - name: Verify every frozen NPZ SHA and array fingerprint with fresh process
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'code/experiments/ch4_loss_controlled_comparison')
          from phase2_frozen_data import load
          for seed in (20261102,20261103,20261104):
              (tx,ty),(vx,vy)=load(seed)
              assert tx.shape==(300,5) and vx.shape==(90,5)
              assert len(ty)==300 and len(vy)==90
          print('FROZEN_THREE_DATA_SEEDS_VERIFIED_NO_TEST')
          PY
      - name: Archive complete immutable dataset evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-ch4-13-phase2-train-validation-${{ github.sha }}
          path: code/experiments/ch4_loss_controlled_comparison/inputs/phase2_train_validation/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit frozen data and provenance to the same branch only
        run: |
          test "$(git branch --show-current)" = "experiment/ch4-loss-controlled-comparison-01"
          test -f code/experiments/ch4_loss_controlled_comparison/inputs/phase2_train_validation/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/experiments/ch4_loss_controlled_comparison/inputs/phase2_train_validation/
          git commit -m "E-CH4-13 phase2: lock 3 seed Train/Validation raw and hashes [DATA_FROZEN_NO_FIT]"
          git push origin HEAD:experiment/ch4-loss-controlled-comparison-01
