name: E-CH4-08 independent matrix-walk evidence

on:
  push:
    branches: [research/e08]
    paths:
      - 'code/experiments/exact_matrix_walk_validation/**'
      - '.github/workflows/e08-matrix-walk.yml'
      - 'tex/chapter4.tex'
      - 'research_journal/2026-11-10-e08-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ONLY E08 branch
        uses: actions/checkout@v4
        with:
          ref: research/e08
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Cheap independent numerical tests before any full-reference execution
        run: python -m unittest discover -s code/experiments/exact_matrix_walk_validation -p 'test_*.py' -v
      - name: Generate preregistered Train/Validation evidence ONCE if absent
        run: |
          if [ ! -f code/experiments/exact_matrix_walk_validation/results/experiment_report.json ]; then
            python code/experiments/exact_matrix_walk_validation/run.py --execute --code-commit "$GITHUB_SHA"
          else
            echo "E08 results already exist; no experiment will be repeated."
          fi
      - name: Verify persisted raw evidence and snapshots WITHOUT rerun
        run: python code/experiments/exact_matrix_walk_validation/verify_results.py
      - name: Commit output ONLY inside research/e08
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/exact_matrix_walk_validation/results \
                  code/experiments/exact_matrix_walk_validation/tables \
                  code/experiments/exact_matrix_walk_validation/figures \
                  code/experiments/exact_matrix_walk_validation/REPORT_FA.md
          if ! git diff --cached --quiet; then
            git commit -m 'E08: persist SHA-verified 300-reference matrix walk evidence'
            git push origin HEAD:research/e08
          fi
