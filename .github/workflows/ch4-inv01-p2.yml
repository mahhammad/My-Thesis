name: CH4-EXP-INV-01 P2 bounded convergence pilot

on:
  push:
    branches: [experiment/ch4-inv01-preflight]
    paths:
      - 'code/experiments/inverse_attainable_standard/p2_convergence.py'
      - '.github/workflows/ch4-inv01-p2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/ch4-inv01-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Stage unchanged archived StreamGraph and D09 sources at historical import paths
        run: |
          mkdir -p code/experiments/multistep_policy_target_match code/experiments/diag_max_full300
          cp code/experiments/archive/multistep_policy_target_match/{run.py,bootstrap_inverse.py,test_bootstrap_inverse.py} code/experiments/multistep_policy_target_match/
          cp code/experiments/archive/diag_max_full300/stream_graph.py code/experiments/diag_max_full300/
      - name: Selected existing historical D09 correctness tests
        run: python -m unittest discover -s code/experiments/multistep_policy_target_match -p 'test_bootstrap_inverse.py' -v
      - name: Single strictly bounded numerical P2 job
        shell: bash
        run: |
          if [ -f code/experiments/inverse_attainable_standard/results/p2_summary.json ]; then
            echo 'Existing P2 evidence is retained; skip duplicate numerical execution.'
          else
            timeout --signal=INT --kill-after=5s 870s python code/experiments/inverse_attainable_standard/p2_convergence.py --run
          fi
      - name: Verify P2 outputs and numerical resource guards
        run: python code/experiments/inverse_attainable_standard/p2_convergence.py --verify
      - name: Preserve partial or complete P2 data even after numerical failure
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f code/experiments/inverse_attainable_standard/results/p2_manifest.json \
            code/experiments/inverse_attainable_standard/results/p2_trace.json \
            code/experiments/inverse_attainable_standard/results/p2_curve.csv \
            code/experiments/inverse_attainable_standard/results/p2_summary.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'research(ch4): preserve bounded P2 D09 solver convergence traces'
            git push origin HEAD:experiment/ch4-inv01-preflight
          fi
