name: Chapter 4 snapshot smoke tests

on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/benchmark_v1/**'
      - '.github/workflows/chapter4-snapshot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Train/Validation-only unit and round-trip checks
        run: |
          python -m unittest -v \
            code/experiments/benchmark_v1/test_snapshot_pipeline.py \
            code/experiments/benchmark_v1/test_snapshot_roundtrip.py \
            code/experiments/benchmark_v1/test_class_tied_start.py \
            code/experiments/benchmark_v1/test_node_class_validation_starts.py \
            code/experiments/benchmark_v1/test_engine.py \
            code/experiments/benchmark_v1/test_metrics_extensions.py
