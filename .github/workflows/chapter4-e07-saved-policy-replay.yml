name: E-CH4-07 saved policy metric recovery
on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/sigmoid_margin_observational_evaluation/replay_saved_full300.py'
      - '.github/workflows/chapter4-e07-saved-policy-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay-saved-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact expected-walk dependencies (CPU)
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Reconstruct only saved full300 policies, verify historical checks
        run: |
          python code/experiments/sigmoid_margin_observational_evaluation/replay_saved_full300.py
          python -m unittest discover -s code/experiments/sigmoid_margin_observational_evaluation -p 'test_*.py' -v
      - name: Commit verified metrics to chapter4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/sigmoid_margin_observational_evaluation/results/metrics_full.json code/experiments/sigmoid_margin_observational_evaluation/results/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'E-CH4-07: verified common metrics for three saved full300 policies'
            git push origin HEAD:chapter4
          fi
