name: CH4-EXP-INV-01 phase-1 bounded preflight

on:
  push:
    branches: [experiment/ch4-inv01-preflight]
    paths:
      - 'code/experiments/inverse_attainable_standard/preflight.py'
      - '.github/workflows/ch4-inv01-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/ch4-inv01-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Stage original archived D09 modules at their historical import path
        run: |
          mkdir -p code/experiments/multistep_policy_target_match
          cp code/experiments/archive/multistep_policy_target_match/{run.py,bootstrap_inverse.py,test_run.py,test_bootstrap_inverse.py} code/experiments/multistep_policy_target_match/
      - name: Historical D09 correctness regressions on tiny references
        run: |
          python -m unittest discover -s code/experiments/multistep_policy_target_match -p 'test_bootstrap_inverse.py' -v
      - name: Bounded real-cost probe on balanced n=150 (one class only)
        run: |
          if [ ! -f code/experiments/inverse_attainable_standard/results/preflight_measurements.json ]; then
            python code/experiments/inverse_attainable_standard/preflight.py --measure
          else
            echo 'Existing measurements; not remeasuring'
          fi
      - name: Read-only preflight verification
        run: |
          python code/experiments/inverse_attainable_standard/preflight.py --verify
      - name: Persist measurements only in isolated preflight branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/inverse_attainable_standard/results/preflight_measurements.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ch4): preserve INV01 bounded n150 preflight measurements'
            git push origin HEAD:experiment/ch4-inv01-preflight
          fi
