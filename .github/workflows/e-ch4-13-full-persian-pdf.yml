name: E-CH4-13 full XeLaTeX Persian PDF + visual evidence (NO FIT)
on:
  push:
    branches:
      - experiment/ch4-loss-controlled-comparison-01
    paths:
      - code/experiments/ch4_loss_controlled_comparison/PERSIAN_TEX_COMPILE_TRIGGER.md
permissions:
  contents: read
jobs:
  compile-persian-thesis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX, Persian support, and PDF image inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-arabic texlive-latex-extra texlive-fonts-recommended \
            texlive-pictures texlive-science texlive-bibtex-extra \
            texlive-lang-other fonts-dejavu-core poppler-utils xindy
      - name: Validate all 11 Persian graphic paths in TeX wrappers and immutable originals
        run: |
          python - <<'PY'
          import json,re,pathlib
          base=pathlib.Path("code/experiments/ch4_loss_controlled_comparison")
          assert (base/"derived/phase2_persian_figures_manifest.json").exists()
          man=json.loads((base/"derived/phase2_persian_figures_manifest.json").read_text())
          assert len(man["records"])==11
          paths=[]
          for n in ("comparison","density","dynamics"):
            source=(base/f"figures/phase2_{n}_figures.tex").read_text()
            paths += re.findall(r"\\includegraphics\[.*?\]\{([^}]+)\}",source)
          assert len(paths)==11 and len(set(paths))==11
          assert all("phase2_tex_fa/" in s for s in paths)
          for p in paths:
              f=pathlib.Path(p)
              assert f.is_file() and f.read_bytes().startswith(b"%PDF"),p
          chapter=pathlib.Path("tex/chapter4.tex").read_text()
          start=chapter.index(r"\label{subsec:ch4-e13-loss-controlled}")
          end=chapter.index(r"\subsection{NLL مبتنی بر KL و JS",start)
          assert r"code/experiments/ch4\_loss\_controlled\_comparison/" in chapter[start:end]
          print("E13_PERSIAN_TEX_REFERENCE_CHECK_PASS: 11 + directory")
          PY
      - name: Compile COMPLETE thesis using XeLaTeX, two passes
        run: |
          set -euo pipefail
          mkdir -p build/e13/tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=build/e13 main.tex > build/e13/xe1.log 2>&1 || {
              tail -n 100 build/e13/xe1.log; exit 1;
            }
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=build/e13 main.tex > build/e13/xe2.log 2>&1 || {
              tail -n 100 build/e13/xe2.log; exit 1;
            }
          test -s build/e13/main.pdf
          pdfinfo build/e13/main.pdf | grep -E 'Pages:|Page size:'
      - name: Extract the 11 figure-bearing PDF pages into a viewable sample PDF and contact sheet
        run: |
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.6' 'Pillow==11.3.0'
          python - <<'PY'
          import fitz,pathlib,re,collections
          from PIL import Image,ImageDraw
          folder=pathlib.Path("build/e13"); aux=(folder/"tex/chapter4.aux")
          if not aux.exists():
              aux=folder/"main.aux"
          raw=aux.read_text(errors="ignore")
          labels=re.findall(r"\\newlabel\{(fig:ch4-e13-[^}]+)\}\{\{[^}]*\}\{(\d+)\}",raw)
          seen={}
          for label,page in labels:seen[label]=int(page)
          assert len(seen)==11,(seen,aux)
          original=fitz.open(folder/"main.pdf")
          # LaTeX aux stores PRINTED page numbers, not physical PDF page indices.
          # Anchor at the uniquely identifiable E13 reproducibility-folder paragraph.
          anchor=[i+1 for i in range(len(original))
                  if "ch4_loss_controlled_comparison/" in original[i].get_text()]
          assert len(anchor)==1,("Cannot locate unique E13 end-of-section physical PDF page",anchor)
          # Read the physical anchor page's Persian PRINTED page number
          # from the bottom footer; it may be one page AFTER the last figure.
          import unicodedata
          footer=[]
          for block in original[anchor[0]-1].get_text("blocks"):
              box,word=block[:4],block[4].strip()
              if box[1]>original[anchor[0]-1].rect.height-110 and word and all(ch.isdecimal() for ch in word):
                  footer.append(int("".join(str(unicodedata.digit(ch)) for ch in word)))
          assert len(footer)==1,("Cannot independently identify E13 printed footer",footer)
          offset=anchor[0]-footer[0]
          assert offset>=0 and max(seen.values())<=footer[0],("Unexpected printed-to-physical offset",offset,footer)
          pages=sorted(set(v+offset-1 for v in seen.values()))
          assert pages and all(0<=p<len(original) for p in pages),seen
          assert min(pages)>=anchor[0]-12,("Figure pages are outside E13 vicinity",pages,anchor)
          print("E13_CORRECT_PHYSICAL_PDF_PAGE_OFFSET",offset,"physical",[p+1 for p in pages])
          sub=fitz.open()
          images=[]
          for pg in pages:
              sub.insert_pdf(original,from_page=pg,to_page=pg)
              rendered=original[pg].get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False)
              image=Image.frombytes("RGB",(rendered.width,rendered.height),rendered.samples)
              f=folder/f"e13_fig_page_{pg+1:03}.png";image.save(f)
              t=image.copy();t.thumbnail((370,500))
              images.append((pg+1,t))
          sub.save(folder/"E13_figure_pages_review.pdf",garbage=4,deflate=True)
          w=3*380;h=((len(images)+2)//3)*550
          contact=Image.new("RGB",(w,h),"white");draw=ImageDraw.Draw(contact)
          for i,(p,t) in enumerate(images):
              x=(i%3)*380;y=(i//3)*550
              draw.text((x+8,y+5),f"Thesis PDF page {p}",fill="black")
              contact.paste(t,(x+5,y+28))
          contact.save(folder/"E13_Persian_contact_sheet.png")
          (folder/"e13_pdf_page_index.txt").write_text(
             "\n".join(f"{k}: printed {v}, physical PDF page {v+offset}" for k,v in sorted(seen.items()))+"\n",encoding="utf-8")
          print("E13_11_FIGURES_ALL_IN_COMPILED_THESIS_PDF",seen,"pages",pages)
          PY
      - name: Deliver complete compiled thesis and localized figure-page visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-ch4-13-compiled-thesis-persian-visual-review
          path: |
            build/e13/main.pdf
            build/e13/E13_figure_pages_review.pdf
            build/e13/E13_Persian_contact_sheet.png
            build/e13/e13_pdf_page_index.txt
            build/e13/xe1.log
            build/e13/xe2.log
          if-no-files-found: warn
          retention-days: 90
