name: E-CH4-13 manager-approved conditional two-fit pilot
on:
  push:
    branches:
      - experiment/ch4-loss-controlled-comparison-01
    paths:
      - 'code/experiments/ch4_loss_controlled_comparison/**'
      - '.github/workflows/e-ch4-13-pilot.yml'
permissions:
  contents: write
jobs:
  guard-and-test:
    if: contains(github.event.head_commit.message, '[RUN_APPROVED_PILOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute complete lightweight tests before any fit
        run: |
          python -m py_compile code/experiments/ch4_loss_controlled_comparison/run_experiment.py
          python code/experiments/ch4_loss_controlled_comparison/run_experiment.py
          python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_*.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_common_metrics_contract.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_pipeline.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_roundtrip.py'
  execute-approved-pilot:
    needs: guard-and-test
    if: contains(github.event.head_commit.message, '[RUN_APPROVED_PILOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute exactly two fits of ten updates, no Test
        env:
          E_CH4_13_PREFLIGHT_PASS: 'true'
        run: |
          python code/experiments/ch4_loss_controlled_comparison/run_experiment.py \
            --execute \
            --out code/experiments/ch4_loss_controlled_comparison/results/pilot_seed20261102_shared_two_fits \
            --source-sha "${{ github.sha }}"
      - name: Upload immutable raw and digital metrics for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-ch4-13-pilot-raw-${{ github.sha }}
          path: code/experiments/ch4_loss_controlled_comparison/results/pilot_seed20261102_shared_two_fits/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit immutable pilot evidence to same branch only
        run: |
          test "$(git branch --show-current)" = "experiment/ch4-loss-controlled-comparison-01"
          test -f code/experiments/ch4_loss_controlled_comparison/results/pilot_seed20261102_shared_two_fits/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/experiments/ch4_loss_controlled_comparison/results/pilot_seed20261102_shared_two_fits
          git commit -m "E-CH4-13: preserve two-fit pilot raw and checksums [PILOT_ARTIFACTS]"
          git push origin HEAD:experiment/ch4-loss-controlled-comparison-01
