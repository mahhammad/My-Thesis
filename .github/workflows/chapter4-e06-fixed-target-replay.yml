name: E-CH4-06 fixed-target metric recovery
on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/target_center_guidance_trajectory/replay_fixed_targets.py'
      - '.github/workflows/chapter4-e06-fixed-target-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify byte-compatible fixed-target replay on historic round zero
        run: python code/experiments/target_center_guidance_trajectory/replay_fixed_targets.py --smoke
      - name: Fill all 49 observations only when replay is verified
        run: python code/experiments/target_center_guidance_trajectory/replay_fixed_targets.py
      - name: Verify legacy historical files remain unchanged
        run: python -m unittest discover -s code/experiments/target_center_guidance_trajectory -p 'test_*.py' -v
      - name: Commit checked replay metrics without overwriting archival data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/target_center_guidance_trajectory/results/metrics_full.json code/experiments/target_center_guidance_trajectory/results/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'E-CH4-06: verify fixed-target replay and complete 49-round metrics'
            git push origin HEAD:chapter4
          fi
