name: E-CH4-07 Benchmark size full v2 recovery
on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/sigmoid_margin_observational_evaluation/replay_benchmark_size.py'
      - '.github/workflows/chapter4-e07-benchmark-size-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU exact-walk dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Recover 36 full common reports from SHA256-verified checkpoint ZIPs
        run: python code/experiments/sigmoid_margin_observational_evaluation/replay_benchmark_size.py
      - name: Check E07 history and presentation invariants
        run: |
          python -m unittest discover -s code/experiments/sigmoid_margin_observational_evaluation -p 'test_*.py' -v
          python -m unittest discover -s code/experiments -p test_chapter4_presentation.py -v
      - name: Save verified common metric reports to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/sigmoid_margin_observational_evaluation/results/benchmark_size_metrics_full.json code/experiments/sigmoid_margin_observational_evaluation/results/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'E-CH4-07: verified full v2 metrics for all 36 standard size runs'
            git push origin HEAD:chapter4
          fi
