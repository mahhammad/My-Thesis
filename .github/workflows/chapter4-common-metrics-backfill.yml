name: Chapter 4 common metrics complete report backfill

on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/common_metrics_backfill.py'
      - 'code/experiments/benchmark_v1/report_snapshot.py'
      - 'code/experiments/benchmark_v1/test_common_metrics_contract.py'
      - 'code/experiments/COMMON_METRICS_CONTRACT.json'
      - '.github/workflows/chapter4-common-metrics-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-report-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy and CPU torch
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate shared Chapter 3 formulas and reporting implementation
        run: |
          python -m unittest discover -v \
            -s code/experiments/benchmark_v1 -p 'test_common_metrics_contract.py'
      - name: Backfill all nine Uniform and five Guided exact configurations - no fitting, no Test
        run: |
          python code/experiments/common_metrics_backfill.py --execute \
            --mode both --out /tmp/chapter4-complete-common-metrics
      - name: Save canonical full reports
        uses: actions/upload-artifact@v4
        with:
          name: chapter4-complete-metrics-uniform-guided-v2
          path: /tmp/chapter4-complete-common-metrics/
          retention-days: 30
          if-no-files-found: error
