name: R05 Sec410 internal final 108-source-and-TeX publication gate (NO SOLVER)

on:
  push:
    branches:
      - researcher/05/r05-sec410-endtoend-01-infra
    paths:
      - 'code/experiments/inverse_attainable_standard/qa_final/verify.py'
      - '.github/workflows/r05-sec410-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r05-sec410-final-pure-qa
  cancel-in-progress: false

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict static source pin and syntax
        shell: bash
        run: |
          set -euo pipefail
          p=code/experiments/inverse_attainable_standard/qa_final/verify.py
          test "$(git hash-object "$p")" = "ca0a57644ea7d7fea1e067dacfb94d32ecda52eb"
          python -m py_compile "$p"
      - name: Validate 108/108 raw, trace, per-run audits, 6 exact replays, figures and Persian LaTeX inputs
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s python -u \
            code/experiments/inverse_attainable_standard/qa_final/verify.py
      - name: Commit signed-off internal check evidence (not independent QA)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f code/experiments/inverse_attainable_standard/qa_final/internal_check.json
          if ! git diff --cached --quiet; then
            git commit -m "R05 Sec410: snapshot internal 108-run raw-to-TeX QA gate PASS (independent QA pending)"
            git push origin HEAD:researcher/05/r05-sec410-endtoend-01-infra
          fi
      - name: Recover QA manifest on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r05-sec410-final-internal-qa
          path: code/experiments/inverse_attainable_standard/qa_final/
          if-no-files-found: warn
