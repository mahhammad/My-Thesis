name: E-CH4-14 full-thesis XeLaTeX and Persian figure QA (NO FIT)

on:
  push:
    branches: [experiment/ch4-14-noise-sensitivity-01]
    paths:
      - 'main.tex'
      - 'tex/**'
      - 'code/experiments/synthetic-noise-feature-sensitivity/latex/**'
      - 'code/experiments/synthetic-noise-feature-sensitivity/chapter4_publication.py'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/build_selected_tables.py'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/build_t100_sweep_figures.py'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/build_revision_figures.py'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/latex/tables/**'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/feature-rank/*.csv'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/figures/**'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/loss-gradient/**'
      - 'code/experiments/noise-loss-learning-dynamics-100/publication/noise-policy/**'
      - '.github/workflows/e-ch4-14-full-xelatex-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-thesis-xelatex:
    if: github.repository == 'mahhammad/My-Thesis' && github.ref == 'refs/heads/experiment/ch4-14-noise-sensitivity-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify removed template appendices and remaining TeX references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          main=(root/'main.tex').read_text(encoding='utf-8')
          for name in ('appendix1','appendix2','appendix3'):
              assert not (root/'tex'/f'{name}.tex').exists(),name
              assert not re.search(r'\\(?:input|include)\s*\{[^{}]*'+name+r'\}',main),name
          for rel in re.findall(r'\\(?:input|include)\s*\{([^{}]+)\}',main):
              candidate=root/rel
              assert candidate.with_suffix('.tex').is_file() or candidate.is_file(),rel
          deleted_labels=(
            'app:latexIntro','formula','eq:yek','zirbakhsh','fig:shir','eq1','eq2',
            'Sec:Ref','app:latex:more','tab:motionModels','tab:motionModelsCont',
            'eq:DLT_Ah','alg:DLT','alg:simulation-random','alg:RANSAC',
            'fig:twolion:one','fig:twolion:two','fig:twoLion','fig:parabola',
            'sec:floatObjs','app:refMan','sec:refUsage'
          )
          sources=[root/'main.tex',*sorted((root/'tex').glob('*.tex'))]
          for source in sources:
              txt=source.read_text(encoding='utf-8')
              refs=re.findall(r'\\(?:ref|eqref|autoref|pageref|cref|Cref)\s*\{([^{}]+)\}',txt)
              bad=sorted(set(refs).intersection(deleted_labels))
              assert not bad,(str(source),bad)
          print('POST_TEMPLATE_STATIC_REFERENCES_PASS',len(sources))
          PY
      - name: Use supported Python for Matplotlib t100 figures
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate five frozen t100 sweep charts (NO FIT, NO TEST)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'matplotlib==3.10.0' 'arabic-reshaper>=3.0.0' 'python-bidi>=0.6.0'
          python code/experiments/noise-loss-learning-dynamics-100/publication/build_t100_sweep_figures.py --write
          python code/experiments/noise-loss-learning-dynamics-100/publication/build_revision_figures.py --write
      - name: Verify all curated figures and seven reproducible CSV-derived tables (NO FIT)
        run: |
          set -euo pipefail
          python code/experiments/noise-loss-learning-dynamics-100/publication/build_selected_tables.py
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('code/experiments/noise-loss-learning-dynamics-100/publication')
          chapter=Path('tex/chapter4.tex').read_text(encoding='utf-8')
          section=chapter.split(r'\section{حساسیت سیاست انتخاب ویژگی به افزودن ویژگی‌های نویزی}',1)[1]
          figures=re.findall(r'\\includegraphics\[[^\]]+\]\{([^}]+)\}',section)
          assert len(figures)==32, ('curated-figures',len(figures))
          assert len(set(figures))==len(figures)
          for rel in figures:
              p=Path(rel)
              assert p.is_relative_to(root),rel
              assert p.suffix=='.png' and p.is_file() and p.stat().st_size>5000,rel
          all_tables=(
              'zero_noise_t100','validation_ba_t100','noise_share_t100',
              'performance_t100','geometry_t100',
              'noise_exposure_t100','noise_normalized_t100',
              'precision_train_t100','precision_validation_t100',
              'recall_train_t100','recall_validation_t100'
          )
          main_tables=('zero_noise_t100','validation_ba_t100')
          for name in all_tables:
              tex=str(root/'latex'/'tables'/name)
              assert (root/'latex'/'tables'/(name+'.tex')).is_file(),tex
              assert section.count(r'\input{'+tex+'}')==int(name in main_tables),tex
          assert section.count(r'\input{')==len(main_tables)
          assert all((root/'figures'/'final-sweep'/name).stat().st_size>10000
                     for name in ('decision_t100.png','geometry_primary_t100.png',
                                  'geometry_other_t100.png','policy_exposure_t100.png',
                                  'policy_normalized_t100.png'))
          new_dir=root/'figures'/'revision-trends'
          assert len(list(new_dir.glob('*.png')))==20
          for rel in figures:
              if 'revision-trends/' in rel:
                  assert (Path(rel)).stat().st_size>8000,rel
          print('E14_FIGURES_AND_REPRODUCIBLE_TABLES_PASS',
                len(figures),len(main_tables),len(all_tables))
          PY
      - name: Install XeLaTeX and Persian support
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-arabic texlive-latex-extra texlive-fonts-recommended \
            texlive-pictures texlive-science texlive-bibtex-extra \
            texlive-lang-other fonts-dejavu-core poppler-utils xindy
      - name: Full thesis XeLaTeX, bibliography, index and glossaries
        run: |
          set -euo pipefail
          mkdir -p build/repo-lightweight/tex
          if ! xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
                 -output-directory=build/repo-lightweight main.tex \
                 > build/repo-lightweight/xelatex-pass1.log 2>&1; then
            tail -n 125 build/repo-lightweight/xelatex-pass1.log
            exit 1
          fi
          # BibTeX's aux files live in build/repo-lightweight, and the .bib
          # path is written relative to that aux directory by main.tex.
          cp tex/MyReferences.bib build/repo-lightweight/tex/MyReferences.bib
          # Citation keys are ASCII. -8 avoids a non-portable cp1256fa.csf.
          # BibTeX must run inside the aux output directory, because \include
          # writes \@input{./tex/chapter*.aux} as relative paths.
          if ! ( cd build/repo-lightweight && BIBINPUTS="../../:" bibtex8 -8 -W main ) \
                 > build/repo-lightweight/bibtex.log 2>&1; then
            tail -n 120 build/repo-lightweight/bibtex.log
            exit 1
          fi
          if [ -s build/repo-lightweight/main.idx ]; then
            makeindex build/repo-lightweight/main.idx \
              > build/repo-lightweight/makeindex.log 2>&1 || {
              tail -n 100 build/repo-lightweight/makeindex.log; exit 1;
            }
          fi
          if [ -s build/repo-lightweight/main.glo ] || [ -s build/repo-lightweight/main.blo ] || [ -s build/repo-lightweight/main.acn ]; then
            makeglossaries -d build/repo-lightweight main \
              > build/repo-lightweight/makeglossaries.log 2>&1 || {
              tail -n 125 build/repo-lightweight/makeglossaries.log; exit 1;
            }
          fi
          for pass in 2 3 4; do
            if ! xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
                 -output-directory=build/repo-lightweight main.tex \
                 > "build/repo-lightweight/xelatex-pass${pass}.log" 2>&1; then
              tail -n 125 "build/repo-lightweight/xelatex-pass${pass}.log"
              exit 1
            fi
          done
          test -s build/repo-lightweight/main.pdf
          pdfinfo build/repo-lightweight/main.pdf | tee build/repo-lightweight/pdfinfo.txt
      - name: Verify full PDF and report unresolved references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('build/repo-lightweight')
          log=(p/'main.log').read_text(errors='replace')
          fatal=['! LaTeX Error:','! Emergency stop.','LaTeX Warning: There were undefined references.','LaTeX Warning: There were multiply-defined labels.']
          problems=[x for x in fatal if x in log]
          unresolved=[line for line in log.splitlines() if ("Reference " in line or "Citation " in line) and "undefined" in line]
          (p/'reference-warnings.txt').write_text(
            'Fatal markers: '+repr(problems)+'\n'+
            'Unresolved citation/reference lines:\n'+'\n'.join(unresolved[:100])+'\n',
            encoding='utf-8')
          print('FATAL_MARKERS',problems,'UNRESOLVED_COUNT',len(unresolved))
          assert not problems and not unresolved, 'Full PDF reference gate failed; see reference-warnings.txt'
          assert (p/'main.pdf').stat().st_size > 10000
          print('FULL_XELATEX_REFERENCE_GATE_PASS')
          PY
      - name: Verify §4.14 labels and render focused PDF pages for visual QA
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
          python - <<'PY'
          from pathlib import Path
          import re,json,base64,fitz
          root=Path("build/repo-lightweight")
          aux=(root/"tex/chapter4.aux").read_text(errors="replace")
          log=(root/"main.log").read_text(errors="replace")
          doc=fitz.open(root/"main.pdf")
          names=doc.resolve_names()
          required=(
                    "fig:ch4-e14-ba-bayes","fig:ch4-e14-ba-train-combined","fig:ch4-e14-ba-val-combined",
                    "fig:ch4-e14-train-separation","fig:ch4-e14-train-separation-class","fig:ch4-e14-rjs-shared",
                    "fig:ch4-e14-rjs-class","fig:ch4-e14-rkl-shared","fig:ch4-e14-rkl-class",
                    "fig:ch4-e14-rsqrt-shared","fig:ch4-e14-rsqrt-class","fig:ch4-e14-margin-shared",
                    "fig:ch4-e14-margin-class","fig:ch4-e14-gradient","fig:ch4-e14-gradient-shared-softplus",
                    "fig:ch4-e14-gradient-class-sigmoid","fig:ch4-e14-gradient-class-softplus","fig:ch4-e14-loss-shared-sigmoid",
                    "fig:ch4-e14-loss-shared-softplus","fig:ch4-e14-loss-class-sigmoid","fig:ch4-e14-loss-class-softplus",
                    "fig:ch4-e14-noise-selection","fig:ch4-e14-nfi-shared-sigmoid","fig:ch4-e14-nsr-class-softplus",
                    "fig:ch4-e14-rank-shared-sigmoid","fig:ch4-e14-rank-class-softplus","fig:ch4-e14-policy-exposure-sweep",
                    "fig:ch4-e14-policy-normalized-sweep","tab:ch4-e14-ba","tab:ch4-e14-zero",
                    "eq:ch4-e14-p-fwer7",
                    )
          labels={}
          for key in required:
              found=[line for line in aux.splitlines()
                    if line.startswith(r"\newlabel{"+key+"}")]
              assert len(found)==1,(key,found)
              labels[key]=found[0]
          overfull=[line for line in log.splitlines()
                   if "Overfull \\hbox" in line or "Overfull \\vbox" in line
                   or "Underfull \\hbox" in line]
          issues=[line for line in log.splitlines() if
                  "Undefined control sequence" in line or
                  "multiply defined" in line or
                  "undefined references" in line or
                  "undefined citation" in line]
          assert not issues,issues[:20]
          info=[]
          for label,line in labels.items():
              dest=[n for n in names if n in line]
              pages=[names[n].get("page") for n in dest]
              info.append({"label":label,"aux":line[:180],
                           "destinations":dest[:2],"pages":pages[:2]})
          (root/"e14-layout-audit.json").write_text(json.dumps({
              "pdf_pages":len(doc),"labels":info,
              "warning_count":len(overfull),"warnings":overfull[:200]},
              ensure_ascii=False,indent=2))
          print("E14_LABEL_AUDIT",json.dumps(info,ensure_ascii=False))
          print("E14_LAYOUT_WARNINGS",len(overfull),overfull[:12])
          target=next(x for x in info if x["label"]=="fig:ch4-e14-gradient")
          pg=next((p for p in target["pages"] if isinstance(p,int)),None)
          if pg is None:
              matches=[]
              for i,p in enumerate(doc):
                  data=p.get_text()
                  score=sum(data.count(w) for w in ("گرادیان","هنجار","پوش"))
                  if score:matches.append((score,i))
              pg=max(matches)[1] if matches else None
          if pg is not None and 0<=pg<len(doc):
              for pageid in (pg-1,pg,pg+1):
                  if 0<=pageid<len(doc):
                      pix=doc[pageid].get_pixmap(matrix=fitz.Matrix(.92,.92),alpha=False)
                      jpg=pix.tobytes("jpeg",jpg_quality=65)
                      (root/("e14-visual-page-%d.jpg"%(pageid+1))).write_bytes(jpg)
                      if pageid==pg:
                          print("E14_FIGURE_PAGE",pageid+1,
                                "jpeg-bytes",len(jpg))
                          print("E14_VISUAL_JPEG_BASE64="+base64.b64encode(jpg).decode("ascii"))
          else:
              print("E14_FIGURE_PAGE_UNRESOLVED")
          for label,prefix in (("tab:ch4-e14-ba","E14_TABLE"),
                               ("fig:ch4-e14-ba-bayes","E14_BAYES")):
              record=next(x for x in info if x["label"]==label)
              pageid=next((p for p in record["pages"] if isinstance(p,int)),None)
              if pageid is None:
                  print(prefix+"_PAGE_UNRESOLVED")
                  continue
              p=doc[pageid]
              pix=p.get_pixmap(matrix=fitz.Matrix(.92,.92),alpha=False)
              img=pix.tobytes("jpeg",jpg_quality=62)
              (root/(prefix.lower()+"-visual-page-%d.jpg"%(pageid+1))).write_bytes(img)
              print(prefix+"_PAGE",pageid+1,"bytes",len(img))
              print(prefix+"_JPEG_BASE64="+base64.b64encode(img).decode("ascii"))
          print("E14_FULL_DOCUMENT_PAGES",len(doc))
          PY
      - name: Render representative cover page for human visual review
        if: success()
        run: |
          pdftoppm -f 1 -l 1 -r 90 -png -singlefile \
            build/repo-lightweight/main.pdf build/repo-lightweight/cover-review
      - name: Publish PDF, logs and reference audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-ch4-14-full-thesis-xelatex
          path: |
            build/repo-lightweight/main.pdf
            build/repo-lightweight/cover-review.png
            build/repo-lightweight/pdfinfo.txt
            build/repo-lightweight/reference-warnings.txt
            build/repo-lightweight/xelatex-pass1.log
            build/repo-lightweight/xelatex-pass2.log
            build/repo-lightweight/xelatex-pass3.log
            build/repo-lightweight/xelatex-pass4.log
            build/repo-lightweight/bibtex.log
            build/repo-lightweight/makeindex.log
            build/repo-lightweight/makeglossaries.log
            build/repo-lightweight/main.log
            build/repo-lightweight/e14-layout-audit.json
            build/repo-lightweight/e14-visual-page-*.jpg
            build/repo-lightweight/e14_table-visual-page-*.jpg
            build/repo-lightweight/e14_bayes-visual-page-*.jpg
          if-no-files-found: warn
          retention-days: 90
