name: Chapter 4 benchmark archive linkage integrity (NO FIT)
on:
  pull_request:
    paths:
      - 'code/experiments/benchmark_v1/**'
      - 'code/experiments/standard_policy_comparison/**'
      - 'code/experiments/archive/**'
      - 'code/experiments/inverse_attainable_standard/**'
      - 'research_journal/archive_recovery/**'
      - 'research_journal/ch4-14-synthetic-data-structure-sensitivity-plan.md'
      - 'code/experiments/exact-matrix-evaluation/**'
      - 'code/experiments/sigmoid-margin-evaluation/**'
      - 'code/experiments/true-horizon-effect/**'
      - 'code/experiments/test_chapter4_presentation.py'
      - 'code/experiments/test_benchmark_archive_links.py'
      - '.github/workflows/chapter4-benchmark-archive-linkage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse all experiment Python files without execution or bytecode writes
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('code/experiments').rglob('*.py'))
          for path in files:
              compile(path.read_bytes(), str(path), 'exec')
          print(f'SYNTAX_PASS files={len(files)}')
          PY
      - name: Inventory any remaining code references to retired archive
        run: |
          python - <<'PY'
          from pathlib import Path
          hits=[]
          for path in Path("code/experiments").rglob("*.py"):
              for n,line in enumerate(path.read_text(encoding="utf-8").splitlines(),1):
                  if ("code/experiments/archive/" in line
                          or "/archive/" in line
                          or "'archive'" in line
                          or '"archive"' in line):
                      hits.append((str(path),n,line.strip()[:210]))
          for path,n,source in hits:
              print(f"RETIRED_ARCHIVE_PATH {path}:{n}: {source}")
          print("RESIDUAL_RETIRED_ARCHIVE_REFERENCES",len(hits))
          PY
      - name: Verify 76 canonical runs, 137 recoverable Git-tag blobs, and reference imports
        run: python -m unittest discover -s code/experiments -p test_benchmark_archive_links.py -v
  scientific-readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      E_CH4_13_PHASE2_OPT_IN: NOT_AUTHORIZED
      E_CH4_13_PHASE2_EXTERNAL_GATE_VERIFIED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only scientific dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: B02 pure-gate safety and E06/E07 persisted-report regressions (NO FIT)
        run: |
          python -m unittest discover -s code/experiments/inverse_attainable_standard/b02_gate_v3 -p test_pure_gate.py -v
          python -m unittest discover -s code/experiments/inverse_attainable_standard/b02_gate_candidate -p test_pure_gate.py -v
          python -m unittest discover -s code/experiments/sigmoid-margin-evaluation -p test_analyze.py -v
          python -m unittest discover -s code/experiments/target_center_guidance_trajectory -p test_replay_presentation.py -v
      - name: E07 persisted Train/Validation reports (NO REPLAY)
        run: |
          python -m unittest discover -s code/experiments/sigmoid-margin-evaluation -p test_benchmark_300.py -v
          python -m unittest discover -s code/experiments/sigmoid-margin-evaluation -p test_benchmark_size_full.py -v
      - name: E08 and E09 saved-result audits (NO REPLAY)
        run: |
          python code/experiments/exact-matrix-evaluation/verify_results.py
          python code/experiments/true-horizon-effect/verify.py
      - name: Chapter4 presentation and shared snapshot/metrics
        run: |
          python -m unittest discover -s code/experiments -p test_chapter4_presentation.py -v
          python -m unittest discover -s code/experiments/benchmark_v1 -p test_common_metrics_contract.py -v
          python -m unittest discover -s code/experiments/benchmark_v1 -p test_snapshot_roundtrip.py -v
          python -m unittest discover -s code/experiments/benchmark_v1 -p test_engine.py -v
