name: E-CH4-13 lightweight preflight (no training)
on:
  push:
    branches:
      - experiment/ch4-loss-controlled-comparison-01
    paths:
      - 'code/experiments/ch4_loss_controlled_comparison/**'
      - '.github/workflows/e-ch4-13-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-training-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and dry-run guard (zero optimizer updates)
        run: |
          python -m py_compile code/experiments/ch4_loss_controlled_comparison/run_experiment.py
          python code/experiments/ch4_loss_controlled_comparison/run_experiment.py
      - name: Run independent E-CH4-13 tests without any training or Test split
        run: python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_*.py'
      - name: Run canonical snapshot and metric contract regression tests
        run: |
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_common_metrics_contract.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_pipeline.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_roundtrip.py'
