name: R05 Sec410 selected-center geometry+density dry-run B01 B03 B05 (no solve)
on:
  push:
    branches: [researcher/05/r05-sec410-endtoend-01-analysis]
    paths: ['.github/workflows/r05-sec410-reconstruct-preview.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: r05-sec410-geometry-preview
  cancel-in-progress: false

jobs:
  forensic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU libraries
        run: |
          python -m pip install numpy==2.4.6
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib
      - name: No optimizer replay of selected policies; exact Train-only R/I/T/BT/TNL/BTNL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          p=code/experiments/inverse_attainable_standard/analysis_v3
          test "$(git hash-object "$p/reconstruct_metrics.py")" = "5ed49e3f49a7d1c6b105e017020ffeb0cedda3ae"
          python -m py_compile "$p/reconstruct_metrics.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for block in B01 B03 B05; do
            echo "R05_RECONSTRUCT_START=$block"
            timeout --signal=TERM --kill-after=5s 600s python -u "$p/reconstruct_metrics.py" \
              --block "$block" --owner-root-comment 6852780179
            git add -f code/experiments/inverse_attainable_standard/results/reconstructed/
            if ! git diff --cached --quiet; then
              git commit -m "R05 Sec410: exact selected-policy Train-only geometry and density $block"
              git push origin HEAD:researcher/05/r05-sec410-endtoend-01-analysis
              echo "R05_RECONSTRUCT_CHECKPOINT_SHA=$(git rev-parse HEAD)"
            fi
          done
      - name: Preserve partial replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r05-sec410-reconstruct-three-n150-blocks
          path: code/experiments/inverse_attainable_standard/results/reconstructed/
          if-no-files-found: warn
