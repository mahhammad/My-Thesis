name: FIX-CH4-09 MC versus exact lightweight diagnostic

on:
  push:
    branches: [integration/ch4-release]
    paths:
      - 'code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/**'
      - '.github/workflows/fix-ch4-09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ONLY integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/ch4-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Controlled replay if evidence not already saved
        run: |
          if [ ! -f code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/results/controlled_uniform_replay.json ]; then
            python code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/analyze.py --execute
          else
            echo "FIX09 saved replay exists: do NOT run it again."
          fi
      - name: Controlled higher-budget comparison ONCE if absent
        run: |
          if [ ! -f code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/results/mc_convergence.json ]; then
            python code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/convergence.py --execute
          else
            echo "FIX09 higher-budget evidence already exists; no repeat."
          fi
      - name: Verify the saved evidence read-only
        run: python code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/verify.py
      - name: Run related reproducible regression suites
        run: |
          python -m unittest discover -s code/policy_evaluator -p 'test_*.py' -v
          python -m unittest discover -s code/experiments/guided_informative_uniform_mixture -p 'test_*.py' -v
          python -m unittest discover -s code/experiments/exact_matrix_walk_validation -p 'test_*.py' -v
          python -m unittest discover -s code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09 -p 'test_*.py' -v
          python -m unittest discover -s code/experiments -p test_chapter4_presentation.py -v
          python -m unittest discover -s code/experiments/benchmark_v1 -p test_chapter4_latex_syntax.py -v
          python -m unittest discover -s code/experiments/target_center_guidance_trajectory -p test_unified_narrative.py -v
          python -m unittest discover -s code/experiments/target_center_guidance_trajectory -p test_replay_presentation.py -v
          python -m unittest discover -s code/experiments/target_center_guidance_trajectory -p test_report_assets.py -v
      - name: Persist only the new diagnostic evidence on integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/results/controlled_uniform_replay.json \
                  code/experiments/guided_informative_uniform_mixture/diagnostics/fix_ch4_09/results/mc_convergence.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(ch4): persist controlled MC versus exact source replay'
            git push origin HEAD:integration/ch4-release
          fi
