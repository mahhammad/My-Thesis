name: Chapter 4 E-CH4-07 sigmoid observation integrity
on:
  push:
    branches: [chapter4]
    paths:
      - 'code/experiments/sigmoid_margin_observational_evaluation/**'
      - 'tex/chapter4.tex'
      - '.github/workflows/chapter4-e07-sigmoid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-e07:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archived specialized data vs common reporter; no training, no Test
        run: python -m unittest discover -s code/experiments/sigmoid_margin_observational_evaluation -p 'test_*.py' -v
