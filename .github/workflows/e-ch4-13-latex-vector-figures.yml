name: E-CH4-13 TeX vector figures and Train BA axis fix (NO FIT)
on:
  push:
    branches:
      - experiment/ch4-loss-controlled-comparison-01
    paths:
      - 'code/experiments/ch4_loss_controlled_comparison/PHASE2_LATEX_FIGURES_TRIGGER.md'
      - '.github/workflows/e-ch4-13-latex-vector-figures.yml'
permissions:
  contents: write
concurrency:
  group: e-ch4-13-latex-vector-presentation
  cancel-in-progress: false
jobs:
  compile-figures:
    if: contains(github.event.head_commit.message, '[E13_LATEX_FIGURES_EXPLICIT]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vector SVG to PDF converter only
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.7.1"
      - name: Produce new 70 to 100 axis Train BA SVG without training
        run: |
          set -euo pipefail
          cd code/experiments/ch4_loss_controlled_comparison
          test ! -f figures/phase2_tex/figure11_train_BA_y70_100.svg
          python phase2_figure11_y70_100.py
          python phase2_figure11_y70_100.py --check
      - name: Convert selected frozen SVGs and newly generated figure 11 to LaTeX-compatible vector PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          base=Path("code/experiments/ch4_loss_controlled_comparison/figures")
          out=base/"phase2_tex"
          a=[
            "figure01_validation_BA_methods_by_seed.svg",
            "figure02_train_I_methods_by_seed.svg",
            "phase2_train_R_KL_six_pairs.svg",
            "phase2_validation_R_KL_six_pairs.svg",
            "phase2_train_R_JS_six_pairs.svg",
            "phase2_validation_R_JS_six_pairs.svg",
            "phase2_train_R_sqrt_JS_six_pairs.svg",
            "phase2_validation_R_sqrt_JS_six_pairs.svg",
          ]
          sources=[base/"phase2_repro_v3"/name for name in a]
          sources.extend([base/"phase2_repro_v2"/name for name in (
             "phase2_train_loss_relative_dynamics.svg","phase2_gradient_norm_relative_dynamics.svg"
          )])
          sources.append(out/"figure11_train_BA_y70_100.svg")
          assert len(sources)==11
          for src in sources:
              assert src.exists(),str(src)
              dst=out/src.with_suffix(".pdf").name
              assert not dst.exists(),"Refuse to overwrite: "+str(dst)
              cairosvg.svg2pdf(url=str(src),write_to=str(dst))
              assert dst.read_bytes().startswith(b"%PDF"),str(dst)
              assert dst.stat().st_size>2000, str(dst)
          print("11 PDF files produced from selected SVGs; new BA axis 70..100")
          PY
      - name: Verify source inputs unchanged, then version only derived vector assets
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          git add code/experiments/ch4_loss_controlled_comparison/figures/phase2_tex/
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "E-CH4-13: add 11 vector PDFs and corrected 70-100 Train BA SVG [PRESENTATION_ONLY]"
          git push origin HEAD:experiment/ch4-loss-controlled-comparison-01
