name: E-CH4-13 phase2 design-only CI (NO FIT)
on:
  push:
    branches:
      - experiment/ch4-loss-controlled-comparison-01
    paths:
      - 'code/experiments/ch4_loss_controlled_comparison/**'
      - '.github/workflows/e-ch4-13-phase2-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase2-design-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_CORETYPE: generic
      OPENBLAS_NUM_THREADS: '1'
      E_CH4_13_PHASE2_OPT_IN: NOT_AUTHORIZED
      E_CH4_13_PHASE2_EXTERNAL_GATE_VERIFIED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numeric dependencies (CPU only)
        run: |
          python -m pip install numpy==2.4.6
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Check syntax and manifest dry-run (must NEVER fit)
        run: |
          python -m py_compile code/experiments/ch4_loss_controlled_comparison/phase2_protocol.py
          python -m py_compile code/experiments/ch4_loss_controlled_comparison/phase2_data_preflight.py
          python -m py_compile code/experiments/ch4_loss_controlled_comparison/phase2_runner.py
          python code/experiments/ch4_loss_controlled_comparison/phase2_runner.py > /tmp/phase2_plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/phase2_plan.json'))
          assert p['status']=='DRY_RUN_NO_TRAINING' and p['plan']['fit_cap']==12
          assert p['plan']['test_accessed'] is False
          PY
      - name: Validate 3-seed exact train and validation fingerprints without Test
        run: |
          python code/experiments/ch4_loss_controlled_comparison/phase2_data_preflight.py > /tmp/phase2_fingerprints.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/phase2_fingerprints.json'))
          assert set(x['datasets'])=={'20261102','20261103','20261104'}
          assert all(not x['datasets'][s]['test_accessed'] for s in x['datasets'])
          PY
      - name: Execute independent phase2 fixtures and pilot immutability checks
        run: |
          python code/experiments/ch4_loss_controlled_comparison/diagnose_fingerprints.py
          python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_phase2_design.py'
          python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_e_ch4_13_preflight.py'
          python code/experiments/ch4_loss_controlled_comparison/diagnose_fingerprints.py
          python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_pilot_saved_evidence.py'
      - name: Execute canonical snapshot and metric regression tests
        run: |
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_common_metrics_contract.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_pipeline.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_roundtrip.py'
