name: E-CH4-13 phase2 authorized 12-fit batch
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact reviewed 40-character head SHA (must match branch HEAD)'
        type: string
        required: true
      acknowledgment:
        description: 'Type EXACTLY AUTHORIZE_ONE_12_FIT_BATCH (requires formal Issue #81 manager comment)'
        type: string
        required: true
permissions:
  contents: write
  actions: read
  issues: read
concurrency:
  group: e-ch4-13-phase2-single-use-budget
  cancel-in-progress: false
jobs:
  guarded-phase2:
    if: >-
      github.ref == 'refs/heads/experiment/ch4-loss-controlled-comparison-01'
      && github.event_name == 'workflow_dispatch'
      && inputs.acknowledgment == 'AUTHORIZE_ONE_12_FIT_BATCH'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_CORETYPE: generic
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      E_CH4_13_PHASE2_OPT_IN: 'I_ACCEPT_12_FIT_CAP'
      PYTHONUNBUFFERED: '1'
      E_CH4_13_OUTPUT_ROOT: 'code/experiments/ch4_loss_controlled_comparison/results/phase2_300_25'
    steps:
      - name: Check exact dispatched commit SHA, branch and no existing local outputs
        run: |
          set -euo pipefail
          test "${{ inputs.candidate_sha }}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "experiment/ch4-loss-controlled-comparison-01"
          test ! -e "${E_CH4_13_OUTPUT_ROOT}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical libraries (CPU only)
        run: |
          set -euo pipefail
          python -m pip install numpy==2.4.6
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify 3 frozen seeds and 40+ technical tests on exact SHA
        run: |
          set -euo pipefail
          python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_phase2_*.py'
          python -m unittest discover -v -s code/experiments/ch4_loss_controlled_comparison -p 'test_e_ch4_13_preflight.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_common_metrics_contract.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_pipeline.py'
          python -m unittest discover -v -s code/experiments/benchmark_v1 -p 'test_snapshot_roundtrip.py'
          python code/experiments/ch4_loss_controlled_comparison/phase2_runner.py > /tmp/phase2_safe_dryrun.json
      - name: Independently verify official Issue 81 manager authorization, same-SHA CI, and reserve lifetime 12-fit budget
        run: |
          set -euo pipefail
          python code/experiments/ch4_loss_controlled_comparison/phase2_github_gate.py \
            --sha "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}" \
            --out /tmp/e-ch4-13-phase2-ephemeral-online-authorization.json
          test -s /tmp/e-ch4-13-phase2-ephemeral-online-authorization.json
      - name: Run the approved finite 12-fit batch exactly once (never retry)
        run: |
          set -euo pipefail
          AUTH=/tmp/e-ch4-13-phase2-ephemeral-online-authorization.json
          TOKEN=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["one_time_gate_token"])' "$AUTH")
          python code/experiments/ch4_loss_controlled_comparison/phase2_runner.py \
            --execute --source-sha "${GITHUB_SHA}" --one-time-token "$TOKEN" \
            --authorization-path "$AUTH" --output "${E_CH4_13_OUTPUT_ROOT}"
          unset TOKEN
      - name: Read-only 12-fit paired reducer (reject incomplete raw)
        run: |
          set -euo pipefail
          python code/experiments/ch4_loss_controlled_comparison/phase2_aggregate.py \
            --raw-dir "${E_CH4_13_OUTPUT_ROOT}" \
            --out "${E_CH4_13_OUTPUT_ROOT}/paired_summary.json"
      - name: ALWAYS archive raw, all charged fits, partial snapshots, failure traces and budget checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-ch4-13-phase2-partial-or-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            code/experiments/ch4_loss_controlled_comparison/results/phase2_300_25/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Preserve failure diagnostics even if pre-fit gate refused execution
        if: failure()
        run: |
          echo 'PHASE2_STOP: NO AUTOMATIC RETRY; inspect GH tag e-ch4-13-phase2-budget-spent-<SHA> and all charged markers.'
          echo 'Absence of a full manifest means incomplete 12-fit experiment, not permission to rerun.'
